name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  validate:
    name: Validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Locked restore and vulnerability audit
        shell: pwsh
        run: >-
          dotnet restore RefreshToggle.sln --locked-mode
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
          -p:TreatWarningsAsErrors=true

      - name: Verify formatting
        run: dotnet format RefreshToggle.sln --verify-no-changes --no-restore

      - name: Build with warnings as errors
        run: dotnet build RefreshToggle.sln -c Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Test and enforce Core/Application coverage
        shell: pwsh
        run: >-
          dotnet test tests/RefreshToggle.Tests/RefreshToggle.Tests.csproj
          -c Release --no-build --no-restore
          -p:CollectCoverage=true
          -p:CoverletOutput=${{ github.workspace }}/artifacts/coverage/coverage
          -p:CoverletOutputFormat=cobertura
          '-p:Include=[RefreshToggle.Core]*%2c[RefreshToggle.Application]*'
          -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.rid }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            machine: '0x8664'
          - rid: win-arm64
            machine: '0xAA64'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Locked restore
        run: dotnet restore RefreshToggle.sln --locked-mode

      - name: Publish distribution binary
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.rid }}'
          dotnet publish src/RefreshToggle.App/RefreshToggle.App.csproj `
            -c Release -r '${{ matrix.rid }}' --no-restore --self-contained true `
            -p:DistributionBuild=true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:SourceRevisionId='${{ github.sha }}' -o $output
          Rename-Item (Join-Path $output 'RefreshToggle.exe') `
            (Join-Path $output 'RefreshToggle-${{ matrix.rid }}.exe')

      - name: Verify architecture, version, and single-file layout
        shell: pwsh
        run: |
          $directory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.rid }}'
          $binary = Join-Path $directory 'RefreshToggle-${{ matrix.rid }}.exe'
          $unexpected = @(Get-ChildItem $directory -File | Where-Object FullName -ne $binary)
          if ($unexpected.Count -ne 0) {
            throw "Unexpected publish sidecars: $($unexpected.Name -join ', ')"
          }
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = '0x{0:X4}' -f [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne '${{ matrix.machine }}') {
            throw "Expected PE machine ${{ matrix.machine }}, got $machine."
          }
          $version = (Get-Item $binary).VersionInfo
          if ($version.FileVersion -ne '0.4.0.0') {
            throw "Unexpected file version: $($version.FileVersion)"
          }
          if ($version.ProductVersion -ne "0.4.0+${{ github.sha }}") {
            throw "Unexpected product version: $($version.ProductVersion)"
          }

      - name: Run read-only x64 health check
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: '& "artifacts/${{ matrix.rid }}/RefreshToggle-${{ matrix.rid }}.exe" --health-check'

      - name: Upload distribution binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/RefreshToggle-${{ matrix.rid }}.exe
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    name: quality-gate
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm quality gate
        run: echo 'All validation and publish jobs passed.'

  release-v0-4-0:
    name: Release v0.4.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact merge commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts/release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/release/RefreshToggle-win-*.exe |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii

      - name: Attest x64 binary
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/release/RefreshToggle-win-x64.exe

      - name: Attest ARM64 binary
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/release/RefreshToggle-win-arm64.exe

      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.4.0'
          git fetch origin --tags --force
          if (git tag --list $tag) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "$tag already points to $tagCommit instead of $env:GITHUB_SHA; refusing to move it."
            }
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag $env:GITHUB_SHA -m 'RefreshToggle v0.4.0'
            git push origin "refs/tags/$tag"
          }

          if (gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null) {
            $existing = Join-Path $env:RUNNER_TEMP 'existing-release'
            New-Item -ItemType Directory -Path $existing | Out-Null
            gh release download $tag --repo $env:GITHUB_REPOSITORY `
              --pattern SHA256SUMS.txt --dir $existing
            $expected = (Get-Content artifacts/release/SHA256SUMS.txt -Raw).Trim()
            $actual = (Get-Content (Join-Path $existing 'SHA256SUMS.txt') -Raw).Trim()
            if ($actual -ne $expected) {
              throw 'Existing immutable release checksums do not match this build.'
            }
            $assetNames = @(gh release view $tag --repo $env:GITHUB_REPOSITORY `
              --json assets --jq '.assets[].name')
            foreach ($name in @('RefreshToggle-win-x64.exe', 'RefreshToggle-win-arm64.exe', 'SHA256SUMS.txt')) {
              if ($name -notin $assetNames) { throw "Existing release is missing $name." }
            }
          } else {
            gh release create $tag `
              artifacts/release/RefreshToggle-win-x64.exe `
              artifacts/release/RefreshToggle-win-arm64.exe `
              artifacts/release/SHA256SUMS.txt `
              --repo $env:GITHUB_REPOSITORY `
              --title 'RefreshToggle v0.4.0' `
              --notes-file docs/release-notes-v0.4.0.md `
              --verify-tag --latest
          }

  latest:
    name: Update latest prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality-gate
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-toggle-latest-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out exact master commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download latest binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts/latest
          merge-multiple: true

      - name: Generate latest checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/latest/RefreshToggle-win-*.exe |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content artifacts/latest/SHA256SUMS.txt -Encoding ascii

      - name: Recheck master and update latest without deleting release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $masterSha = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha').Trim()
          if ($masterSha -ne $env:GITHUB_SHA) {
            throw "master advanced to $masterSha; refusing to publish stale commit $env:GITHUB_SHA."
          }

          git tag --force latest $env:GITHUB_SHA
          git push --force origin refs/tags/latest
          $notes = "Automated read-only validated build from master.`n`nCommit: $env:GITHUB_SHA`n`nThis mutable prerelease is not Authenticode-signed. Verify SHA256SUMS.txt before running."
          if (gh release view latest --repo $env:GITHUB_REPOSITORY *> $null) {
            gh release edit latest --repo $env:GITHUB_REPOSITORY `
              --title 'Latest Build' --notes $notes --prerelease
          } else {
            gh release create latest --repo $env:GITHUB_REPOSITORY `
              --title 'Latest Build' --notes $notes --prerelease
          }
          gh release upload latest artifacts/latest/RefreshToggle-win-*.exe `
            artifacts/latest/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
